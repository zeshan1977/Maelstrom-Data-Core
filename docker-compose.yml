services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maelstrom
      POSTGRES_PASSWORD: wickedpassword
      POSTGRES_DB: maelstrom_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maelstrom"]
      interval: 5s
      timeout: 5s
      retries: 5
